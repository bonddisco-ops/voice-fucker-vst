name: Build Voice Fucker

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
          - name: macOS
            os: macos-latest
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "macOS" ]; then
            cmake -B build -G Xcode -DCMAKE_OSX_ARCHITECTURES="arm64;x86_64"
          else
            cmake -B build -G "Visual Studio 17 2022" -A x64
          fi

      - name: Build
        shell: bash
        run: cmake --build build --config Release --target VoiceFucker_All --parallel 4

      - name: Collect files
        shell: bash
        run: |
          mkdir -p out
          ART=build/VoiceFucker_artefacts/Release
          cp -R "$ART/VST3/Voice Fucker.vst3" out/
          if [ "$RUNNER_OS" == "macOS" ]; then
            cp -R "$ART/AU/Voice Fucker.component" out/
            cp -R "$ART/Standalone/Voice Fucker.app" out/
            codesign --force --deep -s - "out/Voice Fucker.vst3" "out/Voice Fucker.component" "out/Voice Fucker.app" || true
          else
            cp "$ART/Standalone/Voice Fucker.exe" out/
          fi
          cp INSTALL.txt out/
          cd out
          if [ "$RUNNER_OS" == "macOS" ]; then
            ditto -c -k --keepParent . "../VoiceFucker-macOS.zip"
          else
            7z a -tzip "../VoiceFucker-Windows.zip" . > /dev/null
          fi

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: VoiceFucker-${{ matrix.name }}
          path: out/

      - name: Publish to the "latest" release
        if: github.event_name == 'push'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release view latest >/dev/null 2>&1 || gh release create latest --title "Voice Fucker (latest build)" --notes "Fresh build from the main branch. Download the zip for your system." --prerelease
          gh release upload latest VoiceFucker-*.zip --clobber
